---
- name: Create the swap file with restricted permissions
  community.general.filesize:
    path: "{{ swap_file_path }}"
    size: "{{ swap_file_size }}"
    blocksize: 512B
    mode: u=rw,go=
    owner: root
    group: root

- name: Inspect the swap file type
  ansible.builtin.command:
    cmd: "blkid -s TYPE -o value {{ swap_file_path }}"
  register: swap_file_type
  changed_when: false
  failed_when: swap_file_type.rc not in [0, 2]

- name: Format the file as swap
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file_path }}"
  when: swap_file_type.stdout != "swap"
  changed_when: true

- name: Persist the swap file in fstab
  ansible.posix.mount:
    path: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    dump: "0"
    passno: "0"
    state: present

- name: Inspect active swap files
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: swap_active_files
  changed_when: false

- name: Activate the swap file
  ansible.builtin.command:
    cmd: "swapon {{ swap_file_path }}"
  when: swap_file_path not in swap_active_files.stdout_lines
  changed_when: true

- name: Configure conservative swap usage
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    state: present
    reload: true

- name: Read the resulting memory configuration
  ansible.builtin.command:
    cmd: free -h
  register: swap_memory_status
  changed_when: false

- name: Display the resulting memory configuration
  ansible.builtin.debug:
    var: swap_memory_status.stdout_lines
