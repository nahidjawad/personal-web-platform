---
- name: Create the application platform directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ compose_platform_directories }}"
  loop_control:
    label: "{{ item.path }}"
- name: Deploy the non-secret Compose environment
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ compose_platform_root }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Deploy the Compose definition
  ansible.builtin.copy:
    src: "{{ compose_platform_source_root }}/compose.yaml"
    dest: "{{ compose_platform_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Validate the deployed Compose definition
  ansible.builtin.command:
    cmd: docker compose --env-file .env config --quiet
    chdir: "{{ compose_platform_root }}"
  changed_when: false
