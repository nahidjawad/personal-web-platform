---
compose_platform_root: /srv/personal-web-platform
compose_platform_db_name: chintavabna
compose_platform_db_user: chintavabna
compose_platform_source_root: "{{ playbook_dir }}/../../compose"

compose_platform_directories:
  - path: "{{ compose_platform_root }}"
    mode: "0755"
  - path: "{{ compose_platform_root }}/nginx"
    mode: "0755"
  - path: "{{ compose_platform_root }}/nginx/conf.d"
    mode: "0755"
  - path: "{{ compose_platform_root }}/secrets"
    mode: "0700"
  - path: "{{ compose_platform_root }}/secrets/tls"
    mode: "0700"
