---
- name: Refresh APT package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install available operating-system updates
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline administration packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Configure the server timezone
  community.general.timezone:
    name: "{{ common_server_timezone }}"

- name: Check whether the server requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required_file

- name: Report whether a reboot is required
  ansible.builtin.debug:
    msg: >-
      Reboot required:
      {{ common_reboot_required_file.stat.exists | bool }}
