---
- name: Provision backup secret files
  hosts: web_servers
  gather_facts: false
  become: true

  vars:
    backup_bucket_name: personal-web-platform-backups
    backup_secrets_root: /srv/personal-web-platform/secrets/backup
    backup_secrets_replace: false

  vars_prompt:
    - name: backup_r2_endpoint
      prompt: Enter the R2 S3 endpoint
      private: false

    - name: backup_r2_access_key_id
      prompt: Enter the R2 Access Key ID
      private: true
      confirm: true

    - name: backup_r2_secret_access_key
      prompt: Enter the R2 Secret Access Key
      private: true
      confirm: true

    - name: backup_restic_password
      prompt: Enter a new Restic repository password
      private: true
      confirm: true

  pre_tasks:
    - name: Validate supplied backup settings
      ansible.builtin.assert:
        that:
          - backup_r2_endpoint | length > 20
          - backup_r2_endpoint is match('^https://.+\\.r2\\.cloudflarestorage\\.com/?$')
          - backup_r2_access_key_id | length > 10
          - backup_r2_secret_access_key | length > 20
          - backup_restic_password | length >= 24
        fail_msg: >-
          The R2 endpoint or backup credentials do not have the expected format.
        quiet: true
      no_log: true

  tasks:
    - name: Create the protected backup secrets directory
      ansible.builtin.file:
        path: "{{ backup_secrets_root }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create the Restic repository password file
      ansible.builtin.copy:
        content: "{{ backup_restic_password }}\n"
        dest: "{{ backup_secrets_root }}/restic-password"
        owner: root
        group: root
        mode: "0600"
        force: "{{ backup_secrets_replace | bool }}"
      no_log: true

    - name: Create the protected Restic environment file
      ansible.builtin.copy:
        content: |
          AWS_ACCESS_KEY_ID={{ backup_r2_access_key_id | quote }}
          AWS_SECRET_ACCESS_KEY={{ backup_r2_secret_access_key | quote }}
          AWS_DEFAULT_REGION=auto
          RESTIC_REPOSITORY={{ ('s3:' ~ (backup_r2_endpoint | regex_replace('/+$', '')) ~ '/' ~ backup_bucket_name) | quote }}
          RESTIC_PASSWORD_FILE={{ (backup_secrets_root ~ '/restic-password') | quote }}
        dest: "{{ backup_secrets_root }}/restic.env"
        owner: root
        group: root
        mode: "0600"
        force: "{{ backup_secrets_replace | bool }}"
      no_log: true

    - name: Inspect the backup secret files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ backup_secrets_root }}/restic-password"
        - "{{ backup_secrets_root }}/restic.env"
      register: backup_secret_files
      no_log: true

    - name: Verify backup secret file protection
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.pw_name == "root"
          - item.stat.gr_name == "root"
          - item.stat.mode == "0600"
        fail_msg: A backup secret file is missing or incorrectly protected.
        quiet: true
      loop: "{{ backup_secret_files.results }}"
      no_log: true
