---
- name: Provision backup monitoring secret files
  hosts: web_servers
  gather_facts: false
  become: true

  vars:
    backup_secrets_root: /srv/personal-web-platform/secrets/backup

  vars_prompt:
    - name: backup_healthchecks_backup_url
      prompt: Enter the Healthchecks.io daily-backup ping URL
      private: true
      confirm: true

    - name: backup_healthchecks_maintenance_url
      prompt: Enter the Healthchecks.io weekly-maintenance ping URL
      private: true
      confirm: true

  pre_tasks:
    - name: Validate supplied Healthchecks.io URLs
      ansible.builtin.assert:
        that:
          - backup_healthchecks_backup_url is match('^https://hc-ping\\.com/.+')
          - backup_healthchecks_maintenance_url is match('^https://hc-ping\\.com/.+')
          - backup_healthchecks_backup_url != backup_healthchecks_maintenance_url
        fail_msg: The Healthchecks.io ping URLs do not have the expected format.
        quiet: true
      no_log: true

  tasks:
    - name: Inspect the backup secrets directory
      ansible.builtin.stat:
        path: "{{ backup_secrets_root }}"
      register: backup_secrets_directory

    - name: Verify the backup secrets directory protection
      ansible.builtin.assert:
        that:
          - backup_secrets_directory.stat.exists
          - backup_secrets_directory.stat.isdir
          - backup_secrets_directory.stat.pw_name == "root"
          - backup_secrets_directory.stat.gr_name == "root"
          - backup_secrets_directory.stat.mode == "0700"
        fail_msg: The protected backup secrets directory is missing or incorrectly protected.
        quiet: true

    - name: Create protected Healthchecks.io URL files
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ backup_secrets_root }}/{{ item.name }}"
        owner: root
        group: root
        mode: "0600"
        force: false
      loop:
        - name: healthchecks-backup-url
          value: "{{ backup_healthchecks_backup_url }}"
        - name: healthchecks-maintenance-url
          value: "{{ backup_healthchecks_maintenance_url }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Inspect the Healthchecks.io URL files
      ansible.builtin.stat:
        path: "{{ backup_secrets_root }}/{{ item }}"
      loop:
        - healthchecks-backup-url
        - healthchecks-maintenance-url
      register: backup_healthchecks_files
      no_log: true

    - name: Verify Healthchecks.io URL file protection
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.pw_name == "root"
          - item.stat.gr_name == "root"
          - item.stat.mode == "0600"
        fail_msg: A Healthchecks.io URL file is missing or incorrectly protected.
        quiet: true
      loop: "{{ backup_healthchecks_files.results }}"
      no_log: true
