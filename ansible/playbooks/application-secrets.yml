---
- name: Provision application secret files
  hosts: web_servers
  gather_facts: false
  become: true

  vars_prompt:
    - name: application_wordpress_db_password
      prompt: Enter the WordPress database password
      private: true
      confirm: true

    - name: application_mariadb_root_password
      prompt: Enter the MariaDB root password
      private: true
      confirm: true

  tasks:
    - name: Create the WordPress database password file
      ansible.builtin.copy:
        content: "{{ application_wordpress_db_password }}"
        dest: /srv/personal-web-platform/secrets/wordpress-db-password
        owner: root
        group: www-data
        mode: "0640"
        force: false
      no_log: true

    - name: Set WordPress database password permissions
      ansible.builtin.file:
        path: /srv/personal-web-platform/secrets/wordpress-db-password
        state: file
        owner: root
        group: www-data
        mode: "0640"

    - name: Create the MariaDB root password file
      ansible.builtin.copy:
        content: "{{ application_mariadb_root_password }}"
        dest: /srv/personal-web-platform/secrets/mariadb-root-password
        owner: root
        group: root
        mode: "0600"
        force: false
      no_log: true

    - name: Inspect the application secret files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - path: /srv/personal-web-platform/secrets/wordpress-db-password
          group: www-data
          mode: "0640"
        - path: /srv/personal-web-platform/secrets/mariadb-root-password
          group: root
          mode: "0600"
      register: application_secret_files
      no_log: true

    - name: Verify the application secret files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.pw_name == "root"
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
        fail_msg: An application secret file is missing or incorrectly protected.
        quiet: true
      loop: "{{ application_secret_files.results }}"
      no_log: true
