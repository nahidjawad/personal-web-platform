---
name: personal-web-platform

services:
  proxy:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend
    depends_on:
      wordpress:
        condition: service_started

  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: "${WORDPRESS_DB_NAME}"
      WORDPRESS_DB_USER: "${WORDPRESS_DB_USER}"
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/wordpress_db_password
    secrets:
      - wordpress_db_password
    volumes:
      - wordpress_data:/var/www/html/wp-content
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${WORDPRESS_DB_NAME}"
      MARIADB_USER: "${WORDPRESS_DB_USER}"
      MARIADB_PASSWORD_FILE: /run/secrets/wordpress_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets:
      - wordpress_db_password
      - mariadb_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  frontend:
  backend:
    internal: true

volumes:
  wordpress_data:
  mariadb_data:

secrets:
  wordpress_db_password:
    file: "${PLATFORM_ROOT}/secrets/wordpress-db-password"
  mariadb_root_password:
    file: "${PLATFORM_ROOT}/secrets/mariadb-root-password"
