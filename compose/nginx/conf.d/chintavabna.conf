upstream chintavabna_wordpress {
    server wordpress:80;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name chintavabna.com www.chintavabna.com;

    location = /platform-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;

    server_name chintavabna.com www.chintavabna.com;

    ssl_certificate /etc/nginx/tls/chintavabna-origin.pem;
    ssl_certificate_key /etc/nginx/tls/chintavabna-origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64m;

    location = /platform-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://chintavabna_wordpress;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ /\. {
        deny all;
    }
}